[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragipi"
version = "1.0.0"
description = "Evaluating Indirect Prompt Injection in RAG Systems: benchmark, defense-in-depth, and security-utility trade-offs (WI-IAT 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yulliwas Ameur" },
    { name = "Miqeas Pedro Mendes" },
    { name = "Samia Bouzefrane" },
    { name = "Lyes Khoukhi" },
]
keywords = [
    "retrieval-augmented-generation",
    "prompt-injection",
    "llm-security",
    "benchmark",
    "defense-in-depth",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
